name: Release Binaries

# 自动编译各平台/架构版本并发布到 GitHub Releases：
# - push v* 标签（如 v1.0.0）时全自动编译 + 创建 Release + 上传二进制
# - 也可手动 workflow_dispatch 指定 tag 重新编译发布
# 发布后会自动触发 generate-release-notes.yml / release-docker.yml

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish, e.g. v1.0.0 (defaults to current ref)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        exclude:
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
        include:
          - goos: linux
            goarch: loong64
        goos: [windows, linux, darwin, freebsd]
        goarch: [amd64, arm64, 386, arm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          BINARY_NAME=komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=${BINARY_NAME}.exe
          fi
          go build -trimpath -ldflags="-s -w -X github.com/VMCoud/komari-agent/update.CurrentVersion=${VERSION}" -o $BINARY_NAME
          sha256sum $BINARY_NAME

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: komari-agent-${{ matrix.goos }}-${{ matrix.goarch }}*

  publish:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euxo pipefail

          cd artifacts
          sha256sum komari-agent-* > checksums.txt
          cat checksums.txt
          cd ..

          TARGET="${GITHUB_SHA}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="main"
          fi

          if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, uploading binaries..."
            gh release upload "${TAG}" artifacts/* --repo "${{ github.repository }}" --clobber
          else
            echo "Creating release ${TAG}..."
            gh release create "${TAG}" \
              --repo "${{ github.repository }}" \
              --target "${TARGET}" \
              --title "${TAG}" \
              --generate-notes \
              artifacts/*
          fi
        shell: bash
